services:
  db:
    image: postgres:17
    container_name: angorderq-db
    environment:
      POSTGRES_USER: angorderq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: angorderq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angorderq -d angorderq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: