<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}angOrderQ{% endblock %}</title>
  {# Link static files with url_for instead of hard-coding paths #}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <header>
    <h1><a href="{{ url_for('index') }}">angOrderQ</a></h1>
    <p class="tagline">Order Queue System for Local Stalls &amp; Vendors</p>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>Built with Flask and Jinja2</footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
